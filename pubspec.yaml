name: pesa_checkout
description: Pesa Checkout for Flutter. Native card fields that post straight to checkout.pesa.co, 3-D Secure in the system browser, no webviews.
version: 0.1.0
homepage: https://pesa.co
repository: https://github.com/pesapeer/pesa-flutter
issue_tracker: https://github.com/pesapeer/pesa-flutter/issues

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  http: ^1.5.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: co.pesa.pesa_checkout
        pluginClass: PesaCheckoutPlugin
      ios:
        pluginClass: PesaCheckoutPlugin

name: Release

# A signed tag vX.Y.Z publishes pesa_checkout to pub.dev through pub.dev's
# automated publishing (OIDC from this workflow; no token). pub.dev must list
# this repository and workflow under the package's "Automated publishing"
# settings with tag pattern v{{version}}.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the tag signature
        run: .github/verify-tag.sh "${GITHUB_REF_NAME}"
      - name: Check the tag matches pubspec.yaml
        run: |
          v=$(sed -n 's/^version: *//p' pubspec.yaml)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "pubspec is $v, tag is ${GITHUB_REF_NAME}" >&2; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: make test
      - run: dart pub publish --force
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
